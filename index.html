<title>Bus Campo de Gibraltar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#101820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Dependencia externa: Leaflet 1.9.4 (cdnjs). Mapa base: © colaboradores de OpenStreetMap. Si Leaflet no carga, se usa el mapa esquemático SVG local. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Concepto: wayfinding urbano. Cabecera oscura tipo placa de estación con mosaico, nodos y líneas de color solo donde significan algo. */
:root{
  --ink:#101820;--paper:#F7F7F4;--card:#FFFFFF;--hair:#D9DDE0;--mute:#5B636A;--deep:#343B40;
  --sig:#FCCC0A;--red:#C8281F;--green:#007A30;--blue:#0039A6;
  --bg:var(--paper);--fg:var(--ink);--sf:var(--card);--bd:var(--hair);--fg2:var(--mute);--sf2:#EEEFEC;
  --r1:4px;--r2:8px;--r3:12px;
  --out:cubic-bezier(.2,.8,.2,1);--in:cubic-bezier(.4,0,1,1);
  --tabh:64px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:max(16px,env(safe-area-inset-left,0px));--sr:max(16px,env(safe-area-inset-right,0px));
  --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1015;--fg:#F2F3F0;--sf:#161D24;--bd:#2A343D;--fg2:#A0AAB2;--sf2:#1D262E;--red:#FF6A61;--green:#3FCB73;--blue:#6C9CFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1015;--fg:#F2F3F0;--sf:#161D24;--bd:#2A343D;--fg2:#A0AAB2;--sf2:#1D262E;--red:#FF6A61;--green:#3FCB73;--blue:#6C9CFF;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;padding:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.bar :focus-visible{outline-color:var(--sig)}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#under{display:none}
#under.on{display:flex}
#view{view-transition-name:screen}
#view.dragging{box-shadow:-12px 0 24px rgba(0,0,0,.25)}
/* cabecera */
.bar{flex:none;position:relative;z-index:3;background-color:var(--ink);color:#fff;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:14px 14px;
  padding:var(--st) var(--sr) 6px var(--sl)}
.bar-in{display:flex;align-items:center;gap:10px;min-height:62px;padding:8px 0}
.bar-t{flex:1;min-width:0}
.kicker{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1{font-size:22px;line-height:1.15;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-act{display:flex;gap:4px}
.stripe{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--stripe,var(--sig));transform-origin:left;animation:stripe .45s var(--out) both}
@keyframes stripe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.icon-btn{width:44px;height:44px;border-radius:var(--r2);display:grid;place-items:center;color:#fff;flex:none}
.icon-btn.pressed{background:rgba(255,255,255,.16)}
.icon-btn[aria-pressed="true"]{color:var(--sig)}
.icon-btn[aria-pressed="true"] svg{fill:currentColor}
.mark{width:40px;height:40px;border-radius:50%;background:var(--sig);color:var(--ink);display:grid;place-items:center;flex:none}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}
/* cuerpo */
.body{flex:1;min-height:0;position:relative}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;
  padding:16px var(--sr) calc(24px + var(--sb)) var(--sl)}
body.root .scroll{padding-bottom:calc(var(--tabh) + 34px + var(--sb))}
.scroll.fill{padding:0;overflow:hidden;touch-action:none}
.ptr{position:absolute;top:0;left:50%;margin-left:-18px;width:36px;height:36px;transform:translateY(-48px);z-index:2;pointer-events:none;color:var(--fg)}
.ptr svg{width:36px;height:36px;transform:rotate(-90deg)}
.ptr circle{fill:var(--sf);stroke:var(--bd);stroke-width:3}
.ptr .pfg{fill:none;stroke:var(--fg);stroke-dasharray:100;stroke-dashoffset:100;stroke-linecap:round}
.ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(270deg)}}
/* tab bar de cristal */
#tabbar{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(8px + var(--sb));height:var(--tabh);display:grid;grid-template-columns:repeat(5,1fr);border-radius:var(--r3);
  background:rgba(16,24,32,.74);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(255,255,255,.13);box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:20;view-transition-name:tabbar;transition:transform .28s var(--out),opacity .2s}
body:not(.root) #tabbar{transform:translateY(calc(100% + 30px + var(--sb)));opacity:0;pointer-events:none}
#tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.7);font-size:11px;font-weight:600;border-radius:var(--r2);z-index:1}
#tabbar button.pressed{background:rgba(255,255,255,.1)}
#tabbar button[aria-current="page"]{color:#fff}
#tabind{position:absolute;top:0;left:0;width:20%;height:100%;pointer-events:none;transition:transform .3s var(--out)}
#tabind::before{content:"";position:absolute;left:22%;right:22%;top:0;height:4px;border-radius:0 0 3px 3px;background:var(--sig)}
/* componentes */
.sect{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg2);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.sect:first-child{margin-top:0}
.sect .grow{flex:1;height:1px;background:var(--bd)}
.tap{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .12s var(--out),background-color .12s}
.tap.pressed{transform:scale(.985);background-color:var(--sf2)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r3)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:var(--r2);font-weight:700;font-size:16px;border:2px solid var(--fg);color:var(--fg);background:var(--sf)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{border-color:#3a4650}
.btn.primary.pressed{background:#26323d;transform:scale(.985)}
.btn[aria-disabled="true"]{opacity:.55}
.btn.small{min-height:44px;font-size:14px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rd{--c:#777;--t:#fff;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--c);color:var(--t);font-weight:800;font-size:14px;letter-spacing:-.02em;flex:none;font-variant-numeric:tabular-nums}
.rd.sm{width:24px;height:24px;font-size:10px}
.rd.lg{width:52px;height:52px;font-size:19px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chips .rd{width:44px;height:44px;font-size:16px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--bd)}
.list{border:1px solid var(--bd);border-radius:var(--r3);overflow:hidden;background:var(--sf)}
.list .row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-weight:650;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.row small,.sub{display:block;color:var(--fg2);font-size:13px;line-height:1.3}
.row .chev{color:var(--fg2)}
.mini{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.grp{position:sticky;top:-1px;z-index:1;background:var(--sf2);color:var(--fg2);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:6px 12px;border-bottom:1px solid var(--bd)}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border:2px solid var(--fg);border-radius:var(--r2);background:var(--sf)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;height:100%}
.search:focus-within{border-color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:var(--r2);border:1.5px solid var(--bd);background:var(--sf);font-weight:600;font-size:14px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.net{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg2)}
.net i{width:9px;height:9px;border-radius:50%;border:2px solid var(--fg2)}
.net.live{color:var(--green)}.net.live i{background:var(--green);border-color:var(--green)}
.net.load i{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.note{display:flex;gap:10px;padding:12px;border-radius:var(--r2);background:var(--sf2);border-left:4px solid var(--sig);font-size:13.5px;line-height:1.4}
.note.err{border-left-color:var(--red)}
.empty{padding:28px 16px;text-align:center;color:var(--fg2)}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.linkbtn{color:var(--blue);font-weight:700;text-decoration:underline;min-height:44px;display:inline-flex;align-items:center}
.skel{height:18px;border-radius:var(--r1);background:var(--sf2);animation:pulse 1.2s ease-in-out infinite;margin:6px 0}
/* planificador */
.trip{position:relative;display:grid;grid-template-columns:28px 1fr 44px;gap:0 8px;padding:12px;background:var(--sf);border:2px solid var(--fg);border-radius:var(--r3)}
.trail{position:relative;display:flex;flex-direction:column;align-items:center;padding:22px 0}
.trail .dot{width:14px;height:14px;border-radius:50%;border:4px solid var(--fg);background:var(--sf);z-index:1}
.trail .dot.b{background:var(--fg)}
.trail .rl{position:absolute;top:30px;bottom:30px;width:4px;background:var(--fg);border-radius:2px}
.fields{display:flex;flex-direction:column;min-width:0}
.field{display:block;padding:10px 4px;min-height:60px;border-radius:var(--r2);width:100%}
.field+.field{border-top:1px solid var(--bd)}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--fg2);text-transform:uppercase}
.val{display:block;font-size:18px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.val.ph{color:var(--fg2);font-weight:500}
.swap{align-self:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center}
.hero{margin:18px 0 0}.hero .btn{width:100%}
.opt{display:block;width:100%;padding:14px;margin-bottom:12px}
.opt-top{display:flex;gap:12px;align-items:center}
.opt-top .grow{flex:1;min-width:0}
.opt-top b{font-size:16px;display:block}
.deps{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;min-height:40px;align-items:center}
.dep{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;min-height:44px;padding:4px 10px;border:1.5px solid var(--bd);border-radius:var(--r2);font-variant-numeric:tabular-nums;line-height:1.15}
.dep b{font-size:17px}.dep small{font-size:11.5px;color:var(--fg2);font-weight:600}
.dep.first{background:var(--ink);border-color:var(--ink);color:#fff}.dep.first small{color:rgba(255,255,255,.78)}
.none{color:var(--fg2);font-size:13.5px}
.leg{display:flex;gap:10px;align-items:center}
.xfer{display:flex;align-items:center;gap:8px;margin:8px 0 8px 12px;padding-left:12px;border-left:4px dotted var(--fg2);font-size:13px;color:var(--fg2);min-height:28px}
.deprow{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--sf)}
.deprow:last-child{border-bottom:0}
.deprow .t{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:62px}
.deprow .m{font-size:12px;font-weight:700;color:var(--fg2);text-align:right;min-width:52px}
/* línea */
.hero-line{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.seg{position:sticky;top:-17px;z-index:4;display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--fg);border-radius:var(--r2);overflow:hidden;background:var(--sf);margin-bottom:12px}
.seg button{min-height:46px;font-weight:700;text-align:center;font-size:14px;position:relative}
.seg button+button{border-left:1px solid var(--bd)}
.seg button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.dirs button{min-height:56px;padding:8px 10px;border:1.5px solid var(--bd);border-radius:var(--r2);background:var(--sf);font-size:13px;line-height:1.25}
.dirs button b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
.dirs button[aria-pressed="true"]{border-color:var(--fg);border-width:2px;box-shadow:inset 0 -4px 0 var(--c,var(--fg))}
.route{list-style:none;margin:0;padding:0}
.route li{--c:var(--fg);position:relative;display:flex;gap:14px;align-items:center;min-height:56px;padding:6px 12px 6px 0;width:100%;animation:rin .32s var(--out) both;animation-delay:calc(var(--i,0)*14ms)}
@keyframes rin{from{opacity:0;transform:translateY(6px)}}
.route li::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:8px;background:var(--c);margin-left:-4px}
.route li:first-child::before{top:50%}.route li:last-child::before{bottom:50%}
.route .node{position:relative;z-index:1;flex:none;width:28px;height:28px;display:grid;place-items:center}
.route .node::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--sf);border:4px solid var(--fg)}
.route li:first-child .node::after,.route li:last-child .node::after{width:22px;height:22px;background:var(--fg);border-color:var(--bg);box-shadow:0 0 0 3px var(--fg)}
.route li.dim{opacity:.4}
.route li.dim::before{background:var(--bd)}
.route .nm{flex:1;min-width:0}
.route b{font-size:16px;font-weight:650;display:block;line-height:1.25}
.route li.hit b{font-weight:800}
.tbl-wrap{overflow:auto;border:1px solid var(--bd);border-radius:var(--r2);background:var(--sf);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-height:60vh;touch-action:pan-x pan-y}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--bd)}
th{position:sticky;top:0;background:var(--ink);color:#fff;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
td{font-size:16px;font-weight:600}td.fr{font-size:12px;color:var(--fg2)}
tr.next td{background:color-mix(in srgb,var(--sig) 30%,transparent)}
.datebar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.datebar input{min-height:48px;border:2px solid var(--fg);border-radius:var(--r2);padding:0 10px;background:var(--sf);flex:1;min-width:0}
/* mapa */
.mapbox{position:absolute;inset:0;touch-action:none;background:var(--sf2);overflow:hidden;cursor:grab}
.mapbox svg,.linemap svg{width:100%;height:100%;display:block}
.mapline{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:3;opacity:.75;vector-effect:non-scaling-stroke}
.has-sel .mapline{opacity:.13}.has-sel .mapline.on{opacity:1;stroke-width:6}
.mnode{fill:var(--sf);stroke:var(--fg);stroke-width:1.5;vector-effect:non-scaling-stroke}
.has-sel .mnode{opacity:.22}.has-sel .mnode.on{opacity:1}
.mlab{fill:var(--fg);font:700 11px var(--font);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;display:none;pointer-events:none}
.mchips{position:absolute;left:0;right:0;top:0;padding:10px var(--sr) 10px var(--sl);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;z-index:2}
.mchips::-webkit-scrollbar{display:none}
.mchips button{flex:none;min-width:44px;min-height:44px;border-radius:22px;padding:0 4px;display:grid;place-items:center;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mchips .all{padding:0 14px;background:var(--ink);color:#fff;font-size:13px}
.mchips [aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
.mctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + 26px + var(--sb));display:flex;flex-direction:column;gap:8px;z-index:2}
.mctl.low{bottom:calc(20px + var(--sb))}
.mctl button{width:48px;height:48px;border-radius:var(--r2);background:rgba(16,24,32,.78);color:#fff;display:grid;place-items:center;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15)}
.mctl button.pressed{background:rgba(60,72,84,.95)}
.linemap{touch-action:none;background:var(--sf2);position:relative;height:min(62vh,520px);border:1px solid var(--bd);border-radius:var(--r3);overflow:hidden}
/* hoja de acciones */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
.veil{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .22s}
.open .veil{opacity:1}
.panel{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + var(--sb));max-width:520px;margin:0 auto;border-radius:var(--r3);background:rgba(22,29,36,.8);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);color:#fff;border:1px solid rgba(255,255,255,.14);transform:translateY(112%);transition:transform .28s var(--out);overflow:hidden}
.open .panel{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);margin:8px auto 2px}
.ph{padding:8px 16px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.ph b{display:block;font-size:17px}.ph small{color:rgba(255,255,255,.72);font-size:13px}
.pi{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 16px;font-weight:600;font-size:16px;border-bottom:1px solid rgba(255,255,255,.08)}
.pi.pressed{background:rgba(255,255,255,.12)}
.pi.cancel{justify-content:center;color:rgba(255,255,255,.78);border-bottom:0}
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 28px + var(--sb));transform:translate(-50%,16px);max-width:min(90vw,420px);padding:12px 16px;border-radius:var(--r2);background:rgba(16,24,32,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;font-weight:600;font-size:14px;opacity:0;pointer-events:none;z-index:70;transition:opacity .2s,transform .26s var(--out);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
body:not(.root) #toast{bottom:calc(24px + var(--sb))}
.pulse{animation:ok .32s var(--out)}
@keyframes ok{40%{transform:scale(1.25)}}
/* transiciones de pantalla */
::view-transition-group(root){animation:none}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(screen),::view-transition-new(screen){mix-blend-mode:normal;animation-duration:280ms;animation-fill-mode:both}
@keyframes in-r{from{transform:translateX(100%)}}
@keyframes out-l{to{transform:translateX(-26%);opacity:.55}}
@keyframes in-l{from{transform:translateX(-26%);opacity:.55}}
@keyframes out-r{to{transform:translateX(100%)}}
@keyframes tin-r{from{transform:translateX(36px);opacity:0}}
@keyframes tout-l{to{transform:translateX(-36px);opacity:0}}

let DB=null;
function index(d){
  const lines=d.lines.map(l=>({...l,color:lineColor(l.code)})).sort((a,b)=>a.code.localeCompare(b.code,'es',{numeric:true}));
  const byId={};lines.forEach(l=>byId[l.id]=l);
  // completar municipio vacío usando el mismo nombre
  const munByName={};for(const id in d.stops){const s=d.stops[id];if(s.m)munByName[norm(s.n)]=s.m}
  for(const id in d.stops){const s=d.stops[id];if(!s.m)s.m=munByName[norm(s.n)]||''}
  const places=new Map(),pidOf={};
  for(const id in d.stops){const s=d.stops[id];const pid=norm(s.n)+'|'+norm(s.m);let p=places.get(pid);
    if(!p){p={pid,name:s.n,mun:s.m,ids:[],la:0,lo:0,lines:new Set()};places.set(pid,p)}
    p.ids.push(id);p.la+=s.la;p.lo+=s.lo;pidOf[id]=pid}
  for(const p of places.values()){p.la/=p.ids.length;p.lo/=p.ids.length}
  const PS={};
  for(const k in d.seq){const lid=k.split('|')[0];if(!byId[lid])continue;const arr=[];
    d.seq[k].forEach(id=>{const pid=pidOf[id];if(!pid)return;if(arr[arr.length-1]!==pid)arr.push(pid);places.get(pid).lines.add(lid)});PS[k]=arr}
  return {lines,byId,stop:d.stops,places,pidOf,PS,seq:d.seq,raw:d};
}

  const hit=mem.get(path);if(hit&&!force&&Date.now()-hit.t<ttl)return hit.v;

  let err;
  for(const b of BASES){
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),timeout);
    try{const r=await fetch(b+path,{signal:ctl.signal,headers:{Accept:'application/json'}});clearTimeout(to);
      if(!r.ok)throw new Error('HTTP '+r.status);const v=await r.json();mem.set(path,{t:Date.now(),v});net.fails=0;return v}
    catch(e){clearTimeout(to);err=e}
  }
  net.fails++;net.downUntil=Date.now()+(net.fails>2?60000:15000);throw err;
}

async function loadLive(force){
  setNet('load');

    const [L,P]=await Promise.all([api('/lineas',{force}),api('/paradas',{force})]);
    const lines=(L.lineas||[]).map(l=>({id:String(l.idLinea),code:l.codigo,name:l.nombre,op:String(l.operadores||'').replace(/[,\s]+$/,'')}));
    if(!lines.length)throw new Error('sin líneas');
    const stops={};
    (P.paradas||[]).forEach(s=>{stops[String(s.idParada)]={n:String(s.nombre).trim(),la:+s.latitud,lo:+s.longitud,m:String(s.municipio||'').trim()}});
    const seq={};
    const rs=await Promise.allSettled(lines.map(l=>api(`/lineas/${l.id}/paradas`,{force})));
    rs.forEach((r,i)=>{
      const l=lines[i];
      if(r.status!=='fulfilled'){['1','2'].forEach(s=>{const k=l.id+'|'+s;if(DB.seq[k])seq[k]=DB.seq[k]});return}
      const by={};
      (r.value.paradas||[]).forEach(x=>{const id=String(x.idParada),s=String(x.sentido);
        if(!stops[id])stops[id]={n:String(x.nombre).trim(),la:+x.latitud,lo:+x.longitud,m:(DB.stop[id]||{}).m||''};
        (by[s]=by[s]||[]).push([+x.orden,id])});
      for(const s in by)seq[l.id+'|'+s]=by[s].sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    });
    const d={lines,stops,seq};
    DB=index(d);store.set('data',{ts:Date.now(),d});net.ts=Date.now();setNet('live');dataChanged();
  }catch(e){setNet(store.get('data',null)?'cached':'snap')}
}

function toDate(hhmm,base){
  const b=base?new Date(base.replace(' ','T')):new Date();const [h,m]=String(hhmm).split(':').map(Number);
  const d=new Date(b);d.setHours(h,m,0,0);if(d<b-30*60000)d.setDate(d.getDate()+1);return d;
}

async function departures(pid,force){
  const p=place(pid);if(!p)return{items:[],ok:false};if(DEV.on){await ensureTT(nowMs());return{items:simDeps(pid),ok:TT.ok>0}}
  const rs=await Promise.allSettled(p.ids.map(id=>api(`/paradas/${id}/servicios`,{ttl:45000,force})));
  const items=[],seen=new Set();let ok=false;
  rs.forEach((r,i)=>{if(r.status!=='fulfilled')return;ok=true;
    (r.value.servicios||[]).forEach(s=>{const k=[s.idLinea,s.sentido,s.servicio].join('|');if(seen.has(k))return;seen.add(k);
      items.push({line:String(s.idLinea),s:String(s.sentido),time:s.servicio,dest:String(s.destino||'').trim(),at:toDate(s.servicio,r.value.horaIni)})})});

}

/* planificador */
function plan(f,t){
  const direct=[],trans=new Map();
  for(const k in DB.PS){const seq=DB.PS[k],i=seq.indexOf(f);if(i<0)continue;const j=seq.indexOf(t,i+1);
    if(j>i){direct.push({k,n:j-i,i,j});continue}
    for(let m=i+1;m<seq.length;m++){const T=seq[m];if(T===t)continue;
      for(const k2 in DB.PS){if(k2.split('|')[0]===k.split('|')[0])continue;const s2=DB.PS[k2],a=s2.indexOf(T);if(a<0)continue;const b=s2.indexOf(t,a+1);if(b<=a)continue;
        const cost=(m-i)+(b-a)+6,key=k+'>'+k2,old=trans.get(key);if(!old||old.cost>cost)trans.set(key,{k,k2,T,i,m,a,b,cost})}}}
  // un transbordo por pareja de líneas: el de menor coste
  const byPair=new Map();[...trans.values()].forEach(x=>{const pk=x.k.split('|')[0]+'>'+x.k2.split('|')[0],o=byPair.get(pk);if(!o||o.cost>x.cost)byPair.set(pk,x)});
  return {direct:direct.sort((a,b)=>a.n-b.n),trans:[...byPair.values()].sort((a,b)=>a.cost-b.cost).slice(0,direct.length?3:6)};
}
const stopOf=(k,pid)=>(DB.seq[k]||[]).find(id=>DB.pidOf[id]===pid);

async function loadTimetable(el,l,p){

  }

function buildMapSvg(box,o){

  box.innerHTML=`<svg role="img" aria-label="Mapa esquemático de líneas y paradas"><g id="mg">${polys.join('')}${nodes}${labs}</g></svg>
   ${o.chips?`<div class="mchips" data-noswipe><button class="all tap" data-m="all" aria-pressed="${!sel}">Todas</button>${DB.lines.map(l=>`<button class="tap" data-m="${l.id}" aria-pressed="${sel===l.id}" aria-label="Línea ${esc(l.code)}" style="background:${l.color};color:${textOn(l.color)}">${esc(l.code.replace(/^M-/,''))}</button>`).join('')}</div>`:''}
   <div class="mctl${o.low?' low':''}"><button class="tap" data-m="in" aria-label="Acercar">${ic('plus')}</button><button class="tap" data-m="out" aria-label="Alejar">${ic('minus')}</button><button class="tap" data-m="fit" aria-label="Ver toda la red">${ic('fit')}</button><button class="tap" data-m="loc" aria-label="Mi ubicación">${ic('locate')}</button></div>`;

  const v={k:1,x:0,y:0};let kmin=1,raf=0,meDot=null;
  const W=Math.max(...[...pts.values()].map(a=>a[0])),H=Math.max(...[...pts.values()].map(a=>a[1]));
  const apply=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;g.setAttribute('transform',`translate(${v.x.toFixed(1)} ${v.y.toFixed(1)}) scale(${v.k})`);
    const r=(sel?6:4.5)/v.k;circ.forEach(c=>c.setAttribute('r',(c.classList.contains('on')?6:4.5)/v.k));labels.forEach(t=>{const s=11/v.k;t.style.fontSize=s+'px';t.setAttribute('dx',8/v.k);t.setAttribute('dy',-6/v.k);t.style.strokeWidth=(3/v.k)+'px'});
    declutter();if(box._bz)box._bz();

  const order=pl.map((x,i)=>i).sort((a,b)=>pl[b].lines.size-pl[a].lines.size);
  function declutter(){
    const zoomed=v.k>kmin*2.2,placed=[];
    order.forEach(i=>{const t=labels[i],x=pl[i];const el=sel?(x.lines.has(sel)&&zoomed):(zoomed&&x.lines.size>=2||v.k>kmin*5);

      const r=[sx,sy-h,sx+w,sy];

      placed.push(r);t.style.display='block'})}
  function fit(lid){

    let ps=[...pts.values()];if(lid)ps=[...DB.places.values()].filter(x=>x.lines.has(lid)).map(x=>pts.get(x.pid));
    const x0=Math.min(...ps.map(a=>a[0])),x1=Math.max(...ps.map(a=>a[0])),y0=Math.min(...ps.map(a=>a[1])),y1=Math.max(...ps.map(a=>a[1]));

  select(sel);if(o.fit)fit(o.fit);busLayerSvg(box,g,X,Y,()=>sel,v);
  if(typeof ResizeObserver!=='undefined'){let first=true;new ResizeObserver(()=>{if(first){first=false;return}}).observe(box)}
  const zoomAt=(cx,cy,f)=>{const nk=Math.max(kmin*.9,Math.min(kmin*18,v.k*f)),ff=nk/v.k;v.x=cx-(cx-v.x)*ff;v.y=cy-(cy-v.y)*ff;v.k=nk;apply()};
  const ptrs=new Map();let moved=0,pinch=0;
  box.addEventListener('pointerdown',e=>{if(e.target.closest('.mchips,.mctl'))return;try{box.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
  box.addEventListener('pointermove',e=>{const pv=ptrs.get(e.pointerId);if(!pv)return;const cur={x:e.clientX,y:e.clientY};ptrs.set(e.pointerId,cur);
    if(ptrs.size===1){v.x+=cur.x-pv.x;v.y+=cur.y-pv.y;moved+=Math.abs(cur.x-pv.x)+Math.abs(cur.y-pv.y);apply()}
    else if(ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=box.getBoundingClientRect();if(pinch)zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/pinch);pinch=d;moved+=10}});

   <div class="mctl${o.low?' low':''}"><button class="tap" data-m="in" aria-label="Acercar">${ic('plus')}</button><button class="tap" data-m="out" aria-label="Alejar">${ic('minus')}</button><button class="tap" data-m="fit" aria-label="Ver toda la red o la línea">${ic('fit')}</button><button class="tap" data-m="loc" aria-label="Mi ubicación">${ic('locate')}</button></div>`;

  tl.on('tileload',()=>{ok++;warn.hidden=true});
  tl.on('tileerror',()=>{bad++;if(!ok&&bad>=3){warn.hidden=false;warn.textContent='No se pudo cargar el mapa base (sin conexión o bloqueado). Se muestran las paradas y los recorridos guardados.'}});
  const lg=L.layerGroup().addTo(map),sg=L.layerGroup().addTo(map);
  const bAll=()=>L.latLngBounds(pl.map(x=>[x.la,x.lo])),stopsOf=(id,s)=>(DB.seq[id+'|'+s]||[]).map(i=>DB.stop[i]).filter(Boolean).map(x=>[x.la,x.lo]);
  const bLine=id=>L.latLngBounds(sentidos(id).flatMap(s=>stopsOf(id,s)));

    Promise.resolve(view._s.refresh()).catch(()=>{}).finally(()=>setTimeout(rest,350))}

const nowMs=()=>DEV.on?DEV.base+(Date.now()-DEV.real0)*DEV.speed:Date.now();
const fmtT=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const saveDev=()=>store.set('dev',DEV);
let PC={db:null,m:{}};
function prof(k){if(PC.db!==DB)PC={db:DB,m:{}};if(PC.m[k])return PC.m[k];
  const seq=DB.PS[k]||[],cum=[0];for(let i=1;i<seq.length;i++)cum.push(cum[i-1]+hav(place(seq[i-1]),place(seq[i]))/1000/24*60+.6);
  return PC.m[k]={seq,cum,tot:cum[cum.length-1]}}
/* horarios reales del CTAN (horarios_lineas) para el día simulado o real */
let TT={key:'',ok:0,trips:{}},ttP=null,ttK='',ttNext=0;
const dkey=T=>{const d=new Date(T);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const tmin=x=>{const[a,b]=x.split(':').map(Number);return a*60+b};
function ensureTT(T){const key=dkey(T);if(TT.key===key)return Promise.resolve(TT);if(ttP&&ttK===key)return ttP;
  if(Date.now()<ttNext)return Promise.resolve(TT);ttK=key;const d=new Date(T);
  ttP=Promise.allSettled(DB.lines.map(l=>api(`/horarios_lineas?lang=ES&idLinea=${l.id}&dia=${d.getDate()}&mes=${d.getMonth()+1}&anyo=${d.getFullYear()}`,{ttl:36e5}))).then(rs=>{
    const trips={};let ok=0;
    rs.forEach((r,i)=>{if(r.status!=='fulfilled')return;ok++;const P=(r.value.planificadores||[])[0];if(!P)return;
      [['1','Ida'],['2','Vuelta']].forEach(([sn,n])=>{const out=[];
        (P['horario'+n]||[]).forEach(row=>{const h=(row.horas||[]).filter(x=>x&&/^\d{1,2}:\d{2}$/.test(x));if(h.length<2)return;
          const s0=tmin(h[0]);let e0=tmin(h[h.length-1]);if(e0<s0)e0+=1440;out.push({s:s0,e:e0})});
        trips[DB.lines[i].id+'|'+sn]=out.sort((x,y)=>x.s-y.s)})});
    ttP=null;if(ok){TT={key,ok,trips}}else ttNext=Date.now()+15000;return TT});
  return ttP}
const ttReady=T=>TT.key===dkey(T)&&TT.ok>0;
const trTime=(P,tr,j)=>tr.s+P.cum[j]/(P.tot||1)*(tr.e-tr.s);
const dayMin=T=>{const d=new Date(T);d.setHours(0,0,0,0);return[+d,(T-d)/6e4]};
function busesAt(T){if(!ttReady(T))return[];const[,m]=dayMin(T),out=[];
  for(const k in DB.PS){const P=prof(k);if(P.seq.length<2)continue;
    for(const tr of(TT.trips[k]||[])){if(m<tr.s||m>tr.e)continue;const r=(m-tr.s)/(tr.e-tr.s||1)*P.tot;let i=0;while(i<P.seq.length-2&&P.cum[i+1]<=r)i++;
      const f=Math.min(1,Math.max(0,(r-P.cum[i])/(P.cum[i+1]-P.cum[i]||1))),A=place(P.seq[i]),B=place(P.seq[i+1]);
      out.push({lid:k.split('|')[0],la:A.la+(B.la-A.la)*f,lo:A.lo+(B.lo-A.lo)*f,next:B.name})}}
  return out}
function simDeps(pid){const T=nowMs(),[d0,m]=dayMin(T),items=[];if(!ttReady(T))return items;
  for(const k in DB.PS){const P=prof(k),i=P.seq.indexOf(pid);if(i<0||i>=P.seq.length-1)continue;const[l,sn]=k.split('|');
    for(const tr of(TT.trips[k]||[])){const t=trTime(P,tr,i);if(t<m-.5||t>m+90)continue;const at=new Date(d0+t*6e4);items.push({line:l,s:sn,time:fmtT(at),dest:dirName(l,sn),at})}}
  return items.sort((a,b)=>a.at-b.at)}
/* tarifa aproximada (estimación por distancia; la real depende de zona y tarjeta) */
function legKm(k,i,j){const P=prof(k);let d=0;for(let x=i;x<j;x++)d+=hav(place(P.seq[x]),place(P.seq[x+1]));return d/1000}
const fare=km=>Math.round(Math.min(3.6,.95+.085*km)*20)/20;
const eur=x=>x.toFixed(2).replace('.',',')+' €';
const fareLeg=(k,i,j)=>fare(legKm(k,i,j));
function startBtn(l,p,a,b){const k=l.id+'|'+p.s;return `<button class="btn primary tap" style="margin-bottom:12px;width:100%" data-a="journey" data-lid="${l.id}" data-s="${p.s}" data-f="${enc(p.f)}" data-t="${enc(p.t)}">${ic('route')}Empezar trayecto · ≈ ${eur(fareLeg(k,a,b))}</button>`}
/* ubicación real en directo */
let watchId=null;
function watchMe(){if(watchId!=null||!navigator.geolocation)return;
  watchId=navigator.geolocation.watchPosition(p=>{me={la:p.coords.latitude,lo:p.coords.longitude}},()=>{watchId=null},{enableHighAccuracy:true,maximumAge:5000})}
/* capa de buses en el mapa */
function busLayerSvg(box,g,X,Y,getSel,v){
  const NS='http://www.w3.org/2000/svg',L=document.createElementNS(NS,'g');g.appendChild(L);
  const note=document.createElement('div');note.className='busnote';box.appendChild(note);
  const upd=()=>{if(!box.isConnected){clearInterval(box._bt);return}
    const sel=getSel(),T=nowMs();ensureTT(T);const ready=ttReady(T),bs=busesAt(T).filter(b=>!sel||b.lid===sel);
    while(L.children.length>bs.length+1)L.removeChild(L.lastChild);
    bs.forEach((b,i)=>{let e=L.children[i];if(!e){e=document.createElementNS(NS,'g');e.setAttribute('class','bus');e.innerHTML='<title></title><circle r="11" stroke="#fff" stroke-width="2"/><text></text>';L.appendChild(e)}
      const li=DB.byId[b.lid];if(!li)return;e.setAttribute('transform',`translate(${X(b.lo).toFixed(1)} ${Y(b.la).toFixed(1)}) scale(${1/v.k})`);
      e.firstChild.textContent=`Línea ${li.code} · próxima parada: ${b.next}`;const c=e.children[1];c.setAttribute('fill',li.color);const t=e.children[2];t.textContent=li.code.replace(/^M-/,'');t.style.fill=textOn(li.color)});
    let me_=L.querySelector('.me');if(me){if(!me_){me_=document.createElementNS(NS,'g');me_.setAttribute('class','me');me_.innerHTML='<circle r="8" fill="#0A84FF" stroke="#fff" stroke-width="3"/>';L.appendChild(me_)}
      me_.setAttribute('transform',`translate(${X(me.lo).toFixed(1)} ${Y(me.la).toFixed(1)}) scale(${1/v.k})`)}
    const hh=fmtT(new Date(T))+(DEV.on?' (simulado)':'');note.textContent=!ready?(Date.now()<ttNext?'Sin conexión con el CTAN: no se pueden comprobar los horarios, así que no muestro buses':'Cargando horarios reales del CTAN…'):bs.length?`${bs.length} ${bs.length===1?'bus':'buses'} en circulación · ${hh} · posición estimada entre la salida y la llegada del horario`:`No hay buses circulando a las ${hh}${sel?' en esta línea':''}`};
  box._bz=()=>{[...L.children].forEach(e=>{const t=e.getAttribute('transform');if(t)e.setAttribute('transform',t.replace(/scale\([^)]*\)/,`scale(${1/v.k})`))})};
  upd();box._bt=setInterval(upd,1000);watchMe()}
/* panel dev */
function devSheet(){
  const sp=[1,10,60,300],[,m]=dayMin(nowMs()),cur_=fmtT(new Date(nowMs()));
  sheet.innerHTML=`<div class="veil" data-a="sheet-close"></div><div class="panel" role="dialog" aria-modal="true" aria-label="Modo desarrollador"><div class="grab"></div><div class="ph"><b>Modo desarrollador</b><small>Simula la hora: buses, salidas y trayecto</small></div>
  <button class="pi tap" data-a="dev-toggle"><span>${DEV.on?'Desactivar simulación':'Activar simulación'}</span></button>
  <div class="devrow"><input type="time" id="dvt" value="${cur_}" aria-label="Hora simulada"><button class="pill tap" data-a="dev-set">Aplicar hora</button></div>
  <div class="devrow">${[['07:30'],['13:00'],['18:30'],['22:45']].map(([h])=>`<button class="pill tap" data-a="dev-q" data-v="${h}">${h}</button>`).join('')}</div>
  <div class="devrow">${sp.map(x=>`<button class="pill tap" data-a="dev-speed" data-v="${x}" aria-pressed="${DEV.speed===x}">×${x}</button>`).join('')}<button class="pill tap" data-a="dev-real">Hora real</button></div>
  <button class="pi tap cancel" data-a="sheet-close">Cerrar</button></div>`;
  sheet.classList.add('on');sheetOpen=true;requestAnimationFrame(()=>requestAnimationFrame(()=>sheet.classList.add('open')))}
function devSet(hhmm){const[h,m]=hhmm.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);DEV={on:true,base:+d,real0:Date.now(),speed:DEV.speed||1};saveDev();devAfter()}
function devAfter(){devSheet();silentRepaint();paintDev()}
function paintDev(){const b=$('#devbar');b.classList.toggle('on',DEV.on);if(DEV.on)b.innerHTML=`DEV · ${fmtT(new Date(nowMs()))} ×${DEV.speed}`}
$('#app').insertAdjacentHTML('beforeend','<button id="devbar" data-a="dev-open" aria-label="Abrir modo desarrollador"></button>');
/* pantalla de trayecto */
function jHtml(p){
  const l=DB.byId[p.lid],k=p.lid+'|'+p.s,P=prof(k),a=P.seq.indexOf(p.f),b=P.seq.indexOf(p.t,a+1),T=nowMs(),tr=p.trip;
  const tm=j=>trTime(P,tr,j),m=(T-p.day)/6e4,at=j=>fmtT(new Date(p.day+tm(j)*6e4)),ca=tm(a),cb=tm(b);let ci=a,fr=0,st='wait';
  if(m>=cb){st='done';ci=b}else if(m>=ca){st='ride';for(let j=a;j<b;j++)if(tm(j+1)<=m)ci=j+1;if(ci<b)fr=(m-tm(ci))/(tm(ci+1)-tm(ci)||1)}
  if(st==='ride'&&b-ci===1&&!p.w){p.w=1;toast('Prepárate: la próxima parada es la tuya')}
  const nm=j=>place(P.seq[j]).name,mins=x=>Math.max(0,Math.ceil(x));
  const txt=st==='wait'?`El bus llega a ${esc(nm(a))} en ${mins(ca-m)} min`:st==='ride'?`En ruta · próxima parada: ${esc(nm(Math.min(ci+1,b)))}`:'Has llegado a tu destino';
  const sub=st==='ride'?`Quedan ${b-ci} ${b-ci===1?'parada':'paradas'} · llegas en ~${mins(cb-m)} min`:st==='wait'?`Salida ${at(a)} · ${b-a} paradas`:'Gracias por viajar';
  let you='';if(me){const tg=st==='wait'?place(P.seq[a]):place(P.seq[b]);you=`<br><small class="sub">Tu ubicación real: a ${fmtDist(hav(me,tg))} de ${esc(tg.name)}</small>`}
  let h=`<div class="jhead"><span class="lbl">${DEV.on?'Simulación · ':''}Línea ${esc(l.code)}</span><b>${txt}</b><small class="sub">${sub} · ≈ ${eur(fareLeg(k,a,b))}</small>${you}</div><ol class="jchain">`;
  for(let j=a;j<=b;j++){
    const cls=(j<ci?'passed ':'')+(j===ci?'cur ':'')+(j===b?'last':'');
    h+=`<li class="jn ${cls}"><span class="jc">${at(j)}</span><span class="jname"><b>${esc(nm(j))}</b><small class="sub">${esc(place(P.seq[j]).mun)}</small>${j===ci&&j!==b?`<span class="jhere">← ${st==='wait'?'Espera aquí':'Estás aquí'}</span>`:''}${j===b?'<span class="jbye">¡Bájate!</span>':''}</span></li>`;
    if(j<b)h+=`<li class="jt ${j<ci?'passed':''}" aria-hidden="true"><i></i>${st==='ride'&&j===ci&&fr>0?`<em style="top:${(fr*100).toFixed(0)}%"></em>`:''}</li>`}
  p.ci=ci;return h+'</ol><button class="btn tap" style="width:100%" data-a="back">Terminar trayecto</button>'}
SCREENS.journey=p=>{const l=DB.byId[p.lid];if(!l)return notFound();
  return{head:header({title:'Tu trayecto',kicker:'Línea '+l.code+' · '+esc(l.name),back:true,color:l.color}),body:`<div id="jbody">${jHtml(p)}</div>`,mount(){watchMe();const c=$('.jn.cur',view);if(c)c.scrollIntoView({block:'center'})}}};
Object.assign(A,{
  journey:async d=>{
    const lid=d.lid,sn=d.s,k=lid+'|'+sn,P=prof(k),t=dec(d.t),b=P.seq.indexOf(t);let f=dec(d.f);const T=nowMs();
    toast('Comprobando horarios y tu ubicación…');await ensureTT(T);
    if(!TT.ok){toast('Sin conexión con el CTAN: no puedo comprobar si hay buses a esta hora');return}
    try{await locate();let best=null,bd=1e9;P.seq.forEach((pid,i)=>{if(i>=b)return;const x=hav(me,place(pid));if(x<bd){bd=x;best=pid}});
      if(best&&bd<=1500){f=best;toast(`Origen según tu ubicación: ${place(best).name} (${fmtDist(bd)})`)}else toast(`Estás a ${fmtDist(bd)} de esta línea; salgo desde ${place(f).name}`)}
    catch(e){toast('Sin ubicación: uso la parada elegida')}
    const a=P.seq.indexOf(f),[d0,m]=dayMin(T),tr=(TT.trips[k]||[]).find(x=>trTime(P,x,a)>=m-1);
    if(!tr){toast(`No hay más buses de esta línea desde ${place(f).name} a partir de las ${fmtT(new Date(T))}`);return}
    push('journey',{lid,s:sn,f,t,trip:tr,day:d0})},
  'dev-open':()=>devSheet(),
  'dev-toggle':()=>{if(DEV.on){DEV.on=false;saveDev();devAfter()}else devSet(fmtT(new Date()))},
  'dev-set':()=>{const v=$('#dvt');if(v&&v.value)devSet(v.value)},
  'dev-q':d=>devSet(d.v),
  'dev-speed':d=>{const t=nowMs();DEV={on:true,base:t,real0:Date.now(),speed:+d.v};saveDev();devAfter()},
  'dev-real':()=>{DEV={on:false,base:0,real0:0,speed:1};saveDev();devAfter()}});
setInterval(()=>{if(DEV.on)paintDev();const c=cur();if(c.name==='journey'){const b=$('#jbody',view);if(b){const o=c.p.ci;b.innerHTML=jHtml(c.p);if(o!==c.p.ci){const e=$('.jn.cur',view);if(e)e.scrollIntoView({block:'center',behavior:'smooth'})}}}},1000);
setInterval(()=>{if(DEV.on&&['stop','results','favs'].includes(cur().name))hydrate(view)},5000);
setTimeout(paintDev,0);

/* ============ arranque ============ */
(function boot(){
  const nav=$('#tabbar');
  nav.insertAdjacentHTML('beforeend',TABS.map(([k,n,i])=>`<button class="tap" data-t="${k}" aria-label="${n}">${ic(i)}<span>${n}</span></button>`).join(''));
  const cached=store.get('data',null);
  try{DB=index(cached&&cached.d&&cached.d.lines&&cached.d.lines.length?cached.d:snapData());net.state=cached?'cached':'snap'}catch(e){DB=index(snapData());net.state='snap'}
  paint(view,cur());syncChrome();
  loadLive(false);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-net.ts>3600000)loadLive(false)});
})();
</script>
